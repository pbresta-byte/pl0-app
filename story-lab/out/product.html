<title>Jyotish Story Reader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column. Thesis first, then a map of which grahas govern which, then ranked claims, then what was set aside and how to test it. */
:root{
  --strip:#e6e9cf; --left:#fdeedd; --right:#fffbf4; --ink:#211c17; --mute:#6a5d50; --rule:#d2c3b0;
  --link:#1b3fa8; --head:#7b2b8f; --hl:#fff1a0; --plum:#2a1830; --pink:#d9758f;
  --good:#2b6a38; --warn:#9b3a1c; --card:#fffdf9; --soft:#f6e6d3;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --strip:#2b2f21; --left:#2a2018; --right:#211c18; --ink:#efe5d8; --mute:#b3a493; --rule:#4a3d31;
  --link:#93b3ff; --head:#d9a2f0; --hl:#5b4e12; --plum:#160c1b; --pink:#c4607c;
  --good:#7fcf8e; --warn:#f09a78; --card:#2a221c; --soft:#2d231b; color-scheme:dark } }
:root[data-theme="dark"]{
  --strip:#2b2f21; --left:#2a2018; --right:#211c18; --ink:#efe5d8; --mute:#b3a493; --rule:#4a3d31;
  --link:#93b3ff; --head:#d9a2f0; --hl:#5b4e12; --plum:#160c1b; --pink:#c4607c;
  --good:#7fcf8e; --warn:#f09a78; --card:#2a221c; --soft:#2d231b; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--right);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6;margin:0}
.bar{background:var(--strip);border-bottom:1px solid var(--rule);text-align:center;font-size:13px;padding:9px 16px;letter-spacing:.02em}
.page{display:grid;grid-template-columns:clamp(14px,3.2vw,36px) minmax(0,1fr);max-width:1000px;margin:0 auto}
.floral{background:
  radial-gradient(circle at 32% 22%,var(--pink) 0 3px,transparent 4px) 0 0/24px 30px,
  radial-gradient(circle at 70% 68%,var(--pink) 0 2px,transparent 3px) 0 0/24px 30px, var(--plum)}
main{min-width:0;padding-inline:16px;padding-block:18px 40px}
h1,h2,h3{font-weight:600;text-wrap:balance;margin:0;line-height:1.25}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-block:0 18px}
.tabs button{font:inherit;font-size:14px;padding:7px 15px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;border-radius:3px}
.tabs button[aria-selected="true"]{background:var(--head);color:#fff;border-color:var(--head)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.who{font-family:var(--mono);font-size:12.5px;color:var(--mute);margin:0 0 6px}
.headline{font-size:clamp(24px,5vw,33px);color:var(--head);margin-bottom:12px;max-width:26ch}
.glance{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0 0 14px;padding:0;list-style:none;font-size:14px}
.glance b{font-weight:600}
.thesis{font-size:17.5px;line-height:1.62;max-width:64ch;margin:0 0 4px}
h2.sec{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:34px 0 4px}
.secsub{margin:0 0 14px;color:var(--mute);font-style:italic;max-width:62ch}
.circuits{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}
.circ{background:var(--card);border:1px solid var(--rule);padding:12px 12px 10px;min-width:0}
.circ h3{font-size:15.5px;color:var(--head)}
.circ .cap{font-size:13.5px;color:var(--mute);margin:3px 0 6px}
.circ svg{display:block;width:100%;height:auto;max-width:100%}
.circ .roles{font-size:13.5px;margin:6px 0 0}
svg text{font-family:var(--serif);fill:var(--ink)}
svg .sub{fill:var(--mute);font-size:10.5px}
svg .nm{font-size:11.5px}
svg .gl{font-size:16px}
svg .mem{fill:var(--card);stroke:var(--head);stroke-width:2.2}
svg .dep{fill:var(--soft);stroke:var(--mute);stroke-width:1}
svg .edge{fill:none;stroke:var(--mute);stroke-width:1.4}
svg .arrow{fill:var(--mute)}
.bars{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:5.2rem minmax(0,1fr) 2.6rem;gap:10px;align-items:center;font-size:14.5px}
.bars .track{background:var(--soft);height:10px;border:1px solid var(--rule)}
.bars .fill{background:var(--head);height:100%}
.bars .v{font-family:var(--mono);font-size:12.5px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.bars li.minor .fill{background:var(--mute)}
details.why{margin:2px 0 0 0}
summary{font-family:var(--mono);font-size:12px;color:var(--link);cursor:pointer;width:max-content;max-width:100%}
.whylist{margin:6px 0 0;padding-left:1.1em;font-size:13.5px;color:var(--mute)}
.claim{padding:16px 0 18px;border-top:1px solid var(--rule)}
.claim:first-of-type{border-top:2px solid var(--ink)}
.chead{display:flex;gap:12px;align-items:baseline}
.rk{font-family:var(--mono);font-size:13px;color:var(--mute);min-width:1.6rem;font-variant-numeric:tabular-nums}
.claim h3{font-size:20px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border:1px solid var(--rule);color:var(--mute);margin-left:8px;vertical-align:2px;white-space:nowrap}
.tag.leads{border-color:var(--head);color:var(--head)}
.claim p{margin:8px 0 0;max-width:66ch;padding-left:calc(1.6rem + 12px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 calc(1.6rem + 12px)}
.chip{font-family:var(--mono);font-size:11.5px;padding:2px 8px;background:var(--soft);border:1px solid var(--rule);color:var(--ink);max-width:100%}
.test{margin:10px 0 0 calc(1.6rem + 12px);font-size:14px;color:var(--mute);max-width:64ch}
.test b{color:var(--ink);font-weight:600}
.aside{background:var(--left);border:1px solid var(--rule);padding:6px 14px}
.aside .a{padding:9px 0;border-top:1px solid var(--rule)}
.aside .a:first-child{border-top:0}
.aside b{font-weight:600}
.aside .a p{margin:2px 0 0;font-size:14.5px;color:var(--mute);max-width:66ch}
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:14px;width:100%;min-width:520px}
th,td{text-align:left;padding:5px 12px 5px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.now td{background:var(--hl)}
.hooks{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.hooks li{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:12px;font-size:14.5px}
.hooks .w{font-family:var(--mono);font-size:12.5px;color:var(--mute)}
.obs{padding:14px 0;border-top:1px solid var(--rule)}
.obs h3{font-size:18px}
.obs p{margin:6px 0 0;max-width:66ch}
.wait{background:var(--card);border:1px solid var(--rule);padding:14px}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);color:var(--mute);font-size:13.5px}
footer p{max-width:70ch;margin:0 0 8px}
@media (max-width:640px){
  .claim p,.chips,.test{padding-left:0;margin-left:0}
  .claim p{padding-left:0}
  .hooks li{grid-template-columns:minmax(0,1fr);gap:2px}
  .bars li{grid-template-columns:4.4rem minmax(0,1fr) 2.4rem}
}
</style>

Shani -Vaishva]","matches":false},{"tag":"Dhaniṣṭha -2] + [Dhaniṣṭha- Somana-yuti-Shani -Śrāvaṇa]","matches":false}],"stats":{"findings":34,"byLens":{"bhava":25,"moon":6,"jaimini":3}},"editorial":{"id":"cristian","headline":"Two circuits run this chart: a loop that builds the self, and an exchange that decides the results.","thesis":"The larger circuit is a loop of Moon, Saturn and Jupiter. The Lagna lord, the mind and the lord of money and gains each sit in the next one's sign, with Rahu and Ketu feeding in, so self, feeling and finances move together. The smaller circuit is an exchange between the Sun and Mercury. It decides what happens to home and fortune (through Venus) and to effort and career (through Mars), and it sits in the 7th and 8th houses. Taken together: Cristian builds himself through the loop, but home, fortune and career reach him through other people and through shared or hidden resources. The current Jupiter period (July 2013 to July 2029) is the stretch where the main loop is in charge.","claims":[{"rank":1,"strength":"leads","title":"Moon, Saturn and Jupiter answer to each other","body":"Saturn (Lagna lord, 11th house) sits in Jupiter's sign. Jupiter (lord of 2 and 11, exalted in the 6th) sits in the Moon's sign. The Moon (12th, with Rahu) sits in Saturn's sign. Nobody in the loop is the boss; each hands the result to the next. So the sense of self, the state of mind and the money and gains are tightly coupled: when one is unsettled the other two feel it. The loop has one very strong member (Jupiter, exalted) and two ordinary ones, which makes it dependable more than dramatic.","evidence":["Moon in Saturn's sign (Capricorn)","Saturn in Jupiter's sign (Sagittarius)","Jupiter in the Moon's sign (Cancer), exalted","Lagna, Rahu and Ketu all route into this loop"],"confirm":"Look for periods when money, mood and sense of direction all shifted together."},{"rank":2,"strength":"leads","title":"The Sun and Mercury exchange signs, and Venus and Mars answer to them","body":"The Sun is in Virgo (Mercury's sign) and Mercury is in Leo (the Sun's sign). Venus (lord of 4 and 9: home and fortune) and Mars (lord of 3 and 10: effort and career) both pass their results to Mercury. So home, fortune, initiative and career are decided by an exchange that sits in the 8th and 7th houses. In practice that points to success through partners, collaborators, shared money, research or analysis, and not through working alone. Mercury is also the soul-significator (28° of Leo, the highest degree in the chart) and aspects the Lagna, so dealing with other people is the main classroom. An exchange that involves the 8th lord is the kind classical texts call dainya: it works, but with effort and delay.","evidence":["Sun (7th lord) in Virgo, 8th house","Mercury (5th and 8th lord) in Leo, 7th house","Venus and Mars both answer to Mercury","Mercury is the Ātmakāraka"],"confirm":"Check whether the big breaks in career and home came through a specific person or a shared venture."},{"rank":3,"strength":"leads","title":"Jupiter's period is the current chapter, and its results come through work","body":"Jupiter has run since July 2013 and continues to July 2029. It is exalted but sits in the 6th house, with Ketu. The gains it promises (2nd and 11th lord) therefore arrive through service, work routines, competition and problem-solving, not as windfalls. Its aspects fall on the 10th house (career), the 12th (the Moon and Rahu) and the 2nd (money). Inside it, the Mars sub-period (March 2026 to February 2027) puts the career lord in the 4th house, so the practical focus this year is the home base: where and how the work is done, property, and the mother's side.","evidence":["Mahādaśā Jupiter, 2013-07 to 2029-07","Jupiter exalted in the 6th, aspecting the 10th, 12th and 2nd","Antardaśā Mars to 2027-02, Mars in the 4th"],"confirm":"Mid-2013 is the clean test: the chart says a restless, outward phase gave way to building through work."},{"rank":4,"strength":"supports","title":"Venus is weak in the 8th, and the weakness has cancellation conditions","body":"Venus (lord of 4 and 9, and the partner-significator) is debilitated in Virgo, 8.2° from the Sun, so it is also combust. This is the clearest weak point: relationships and shared finances are where the training happens. Two cancellation conditions apply. Mercury, the lord of Virgo, is in a kendra from the Lagna, and Jupiter, the lord of Venus's exaltation sign, is in a kendra from the Moon. The engine's own two-condition test also passes. The reading is that the weakness is real and also workable, which is a very different message from a flat verdict of strain.","evidence":["Venus 5.6° Virgo, debilitated, combust","Mercury in the 7th (kendra from Lagna)","Jupiter in the 7th from the Moon (kendra)"],"confirm":"Where partnership or shared money has gone badly, check whether it improved once the pattern was recognised."},{"rank":5,"strength":"supports","title":"Moon with Rahu in the 12th: a mind that withdraws and hungers","body":"The Moon is in Dhaniṣṭhā pāda 2, a rhythm-keeping star whose navāṁśa sign is Virgo, so the feeling is analytical and detail-tuned. Rahu shares the sign, 17° away. The felt life retreats toward solitude, distance and work done out of the public eye, with an appetite for the unconventional. Saturn, the Moon's sign lord, is in the 11th and aspects the Lagna, so the withdrawal is disciplined and not drifting.","evidence":["Moon 27.5° Capricorn, Dhaniṣṭhā-2, 12th house","Rahu 10.3° Capricorn, same sign","Saturn (dispositor) in the 11th, aspecting the Lagna"],"confirm":"Compare with how much of life was spent away from home or out of the spotlight."}],"setAside":[{"what":"Mars","why":"Ordinary by sign, and it hands everything to Mercury. It matters this year only because it runs the sub-period."},{"what":"Rahu and Ketu on their own","why":"They pass their results to Saturn and the Moon. They colour those two but carry no weight alone."},{"what":"The three Daridra (poverty) yogas the app lists","why":"They fire on facts already counted in claims 2 and 3 (the 11th lord in the 6th; the 5th and 8th lord being the same graha). They are those claims seen from the cautious side, not separate evidence, and an exalted Jupiter and the raja yogas weigh against them."},{"what":"Most of the 36 yogas the app lists as present","why":"Many contradict each other (Gajakesari and Adhi beside Daridra). The reading leads with the structure and not the count."}],"hooks":[{"when":"2013-07","event":"Rahu to Jupiter Mahādaśā","expect":"A shift from a restless, outward phase toward building through work and service."},{"when":"2026-03 to 2027-02","event":"Mars Antardaśā","expect":"Attention on the home base, property and where the work is done."},{"when":"2029-07","event":"Jupiter to Saturn Mahādaśā","expect":"The Lagna lord takes over the loop: consolidation, and the self-built side of life carries more weight."}]}},{"id":"maria","name":"Maria","status":"awaiting-birth-data","birth":null,"editorial":{"id":"maria","headline":"Saturn runs this chart, and it sits in its own sign in the 8th house with the Moon.","thesis":"The Lagna, the Moon, Mars, Jupiter and Rahu all hand their results to Saturn, which stands in its own sign, Aquarius, in the 8th house. The Moon, which is both the Lagna lord and the soul-significator, sits within half a degree of Saturn. So endurance, discipline, hidden or shared matters and long horizons are the organising theme, and the sense of self is fused with them. A second, smaller circuit is Mercury, exalted in Virgo in the 3rd house with a debilitated Venus; it governs skill, communication and craft. The Sun in Leo stands alone in its own sign in the 2nd house, so family, speech and resources have their own authority, separate from the Saturn circuit.","claims":[{"rank":1,"strength":"leads","title":"Saturn is the final dispositor, in its own sign, in the 8th","body":"Five points answer to Saturn (the Lagna, Moon, Mars, Jupiter and Rahu), and Saturn answers to no one. It lords the 7th and 8th houses and sits in the 8th with the Moon at 28° of Aquarius, almost exactly conjunct. The Lagna lord and soul-significator being in the 8th with Saturn gives a serious, guarded and durable temperament whose life lessons run through transformation, research, other people's resources and endurance. Saturn in its own sign in the 8th, with the Lagna lord there too, is among the classical markers for a long life. The cost is that the seriousness can read as severity.","evidence":["Saturn 28.0° Aquarius, own sign, 8th house","Moon 28.5° Aquarius, 0.4° from Saturn","Moon is Lagna lord and Ātmakāraka","Lagna, Moon, Mars, Jupiter, Rahu all answer to Saturn"],"confirm":"Compare the reading of a durable, reserved temperament with how the life actually went."},{"rank":2,"strength":"leads","title":"Mars, the strongest planet for this Lagna, is debilitated in the Lagna, with cancellation","body":"For a Cancer Lagna, Mars rules the 5th and 10th, a trine and a kendra, so it is the planet that makes success. It is debilitated at 22° of Cancer, in the Lagna itself. The engine lists cancellation (nīcha-bhaṅga) and three raja-yoga entries tied to it. Mars aspects the 4th, 7th and 8th houses, so it looks straight at the Moon and Saturn. Mars also runs the current Mahādaśā (2021 to 2028), and its results go to Saturn. The period therefore activates the heavy 8th-house placement: it asks for decisive action about 8th-house matters, with the strength coming from the cancellation.","evidence":["Mars 22.3° Cancer, debilitated, Lagna","Lord of the 5th and 10th","Nīcha-bhaṅga and raja yoga #246, #250, #252","Mahādaśā Mars, 2021 to 2028"],"confirm":"Look at what changed around 2021 when this period began."},{"rank":3,"strength":"leads","title":"Mercury is exalted in the 3rd and carries a second circuit","body":"Mercury sits in its own sign, Virgo, exalted, in the 3rd house, and lords the 3rd and 12th. Venus (lord of 4 and 11) and Ketu answer to it. Venus is debilitated in the same sign, 8.8° from Mercury, and an exalted planet in the same sign is a classical way for the weakness to be offset. This is the hands-and-voice part of the chart: skill, communication, craft, siblings and short effort. It is the strongest placement in the chart by sign.","evidence":["Mercury 13.7° Virgo, exalted, 3rd house","Venus 4.9° Virgo, debilitated, same sign","Venus and Ketu answer to Mercury","Bhrātṛvṛddhi yoga (3rd lord strong)"],"confirm":"Check the Mercury Mahādaśā (1961 to 1978) for the clearest expression of skill and communication."},{"rank":4,"strength":"supports","title":"The Sun stands alone in its own sign in the 2nd","body":"The Sun in Leo rules the 2nd house and nothing else answers to it, so family, speech and money have their own authority. It also aspects the 8th house, the Moon and Saturn, so it keeps vitality and standing in view of the heavy placement. This supports the chart without driving it.","evidence":["Sun 16.7° Leo, own sign, 2nd house","Sun aspects the Moon and Saturn in the 8th"],"confirm":"Family and speech as an independent strength."},{"rank":5,"strength":"supports","title":"Jupiter in the 5th protects the Lagna and Mars","body":"Jupiter is a friend in Scorpio in the 5th house and answers to Saturn. Its 5th, 7th and 9th aspects fall on the 9th, 11th and Lagna, and it aspects Mars. It is 10th from the Moon, which is the Gajakesari condition. A protective influence, not a leading one.","evidence":["Jupiter 23.1° Scorpio, 5th house","Aspects the Lagna and Mars","Gajakesari yoga"],"confirm":"Teachers, guidance and a protected feeling around the self."}],"setAside":[{"what":"Kemadruma (the Moon without neighbours)","why":"The app lists it because the 2nd and 12th from the Moon are empty, but the Moon is conjunct Saturn, and many traditions cancel it in that case. Disputed, so it does not lead."},{"what":"Daridra yogas listed by the app","why":"They fire on the Lagna lord being in the 8th, which is claim 1 seen from the cautious side, not separate evidence."},{"what":"Body-type yogas (Dehasthoulya, Krisanga)","why":"Low consequence and weakly specific."},{"what":"Rahu and Ketu on their own","why":"They pass results to Saturn and Mercury and carry no weight alone."}],"hooks":[{"when":"1961 to 1978","event":"Mercury Mahādaśā","expect":"The exalted dispositor in charge: skill, communication and craft at their strongest."},{"when":"2021","event":"Mars Mahādaśā begins","expect":"Decisive action around 8th-house matters: health, transformation, shared resources."},{"when":"2028","event":"Rahu Mahādaśā begins","expect":"Rahu answers to Saturn, so the Saturn circuit sets the tone of the change."}]}},{"id":"celia","name":"Celia","status":"awaiting-birth-data","birth":null,"editorial":{"id":"celia","headline":"A self-led chart: the Sun in its own sign in the Lagna, with three other dignified authorities beside it.","thesis":"The Sun is in its own sign in the Lagna and is the final dispositor for the Lagna, Mars and Venus, so the lords of home, fortune, effort and career all answer to identity. Three other circuits stand apart, each strong in its own sign: Saturn (own sign, 6th) takes the Moon's results, Mercury (exalted, 2nd) takes Rahu's, and Jupiter (own sign, 8th) takes Ketu's. It is a chart of four independent authorities, all dignified, with identity clearly in front. The Sun and Moon are about 189° apart, so the birth falls just after the full moon: identity (Sun, 1st house) and feeling (Moon, 7th house) face each other across the chart. The current Venus period (2014 to 2034) runs through the career lord, which sits combust inside the Sun's own circuit.","claims":[{"rank":1,"strength":"leads","title":"The Sun in its own sign in the Lagna governs three of the key lords","body":"The Lagna lord is in the Lagna, in its own sign, which is the strongest way for the self to be placed. Mars (lord of 4 and 9) and Venus (lord of 3 and 10) both answer to the Sun. So home, fortune, effort and career are decided by personal authority, and the chart favours work in which Celia is visible and in charge. The risk is the usual one for a strong Sun: identity can overshadow the softer significations that Venus carries.","evidence":["Sun 17.9° Leo, own sign, 1st house","Mars and Venus answer to the Sun","Dhīmantaḥ and Śarīra-Saukhya yogas"],"confirm":"A life where authority and visibility were taken on early and held."},{"rank":2,"strength":"leads","title":"Venus, the career lord, is combust in the Lagna and runs the current period","body":"Venus lords the 3rd and 10th and sits 1.7° from the Sun in Leo, an enemy sign, so it is combust. The Mahādaśā of Venus runs 2014 to 2034, so twenty years run through a planet whose own voice is absorbed into the Sun's. The Sun is a strong dispositor, which supports it, but the reading is that career and identity are fused: the work is her. Venus's own themes (art, pleasure, partnership) may need deliberate room.","evidence":["Venus 19.6° Leo, combust, 1.7° from the Sun","Lord of the 3rd and 10th","Mahādaśā Venus, 2014 to 2034"],"confirm":"Look at what shifted in 2014 when this period began."},{"rank":3,"strength":"leads","title":"Mercury, lord of wealth and gains, is exalted in the wealth house","body":"Mercury lords the 2nd and 11th and sits exalted in Virgo in the 2nd house, its own sign, with Rahu answering to it. Lords of both money houses placed that strongly is the standout feature of the chart's resources, and it is why the engine lists several food-and-wealth yogas. Jupiter from the 8th aspects it, which adds support.","evidence":["Mercury 11.4° Virgo, exalted, 2nd house","Lord of the 2nd and 11th","Jupiter aspects the 2nd house"],"confirm":"Speech, trade or advice as a reliable source of income."},{"rank":4,"strength":"supports","title":"The Sun and Moon face each other across the chart","body":"The Moon in Aquarius sits in the 7th house, opposite the Sun and Venus in the Lagna, and it aspects the Lagna. It is also the soul-significator, so partnership and other people are the soul's classroom. Saturn, the Moon's dispositor, is in its own sign in the 6th, so feelings are routed through service, routine and problem-solving, steadily and without drama. The Moon here is ordinary by sign and carries the felt life, not the power.","evidence":["Moon 26.4° Aquarius, 7th house, Ātmakāraka","Sun and Moon about 189° apart","Moon's dispositor Saturn in own sign, 6th"],"confirm":"Relationships as the place where the deepest learning happened."},{"rank":5,"strength":"supports","title":"Jupiter's sub-period (to October 2027) belongs to its own circuit","body":"Jupiter is in its own sign, Pisces, in the 8th, and rules the 5th and 8th. It answers to nobody and only Ketu answers to it. It aspects the 12th, 2nd and 4th houses, so home and money get its protection. As the sub-period lord it brings the themes of depth, research and transformation, and the 5th lord being in the 8th ties creativity to those themes.","evidence":["Jupiter 25.4° Pisces, own sign, 8th house","Antardaśā Jupiter to 2027-10","Aspects the 2nd, 4th and 12th"],"confirm":"Study, research or inner work gaining weight through the current sub-period."}],"setAside":[{"what":"The caution yogas the app lists around Jupiter in the 8th","why":"Jupiter is in its own sign, which classical texts treat as softening that placement, and it belongs to a circuit that is not the one currently running. Left for testing against life events."},{"what":"Mars","why":"Vargottama and well placed, but it answers to the Sun and is not leading anything."},{"what":"Rahu and Ketu on their own","why":"They pass results to Mercury and Jupiter and carry no weight alone."},{"what":"Most of the 35 yogas the app lists as present","why":"Several wealth and comfort yogas repeat claim 3, and several caution yogas depend on a single condition. The reading leads with structure and not the count."}],"hooks":[{"when":"1990 to 2007","event":"Mercury Mahādaśā","expect":"The exalted lord of wealth in charge: communication and income building."},{"when":"2014","event":"Venus Mahādaśā begins","expect":"Work centred on personal authority and visibility."},{"when":"2034","event":"Sun Mahādaśā begins","expect":"The final dispositor of the self-circuit takes over: identity moves to the foreground."}]}}],"together":null}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent), C=D.content, GN=C.grahaName, GG=C.grahaGlyph;
var EN=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
function sk(s){return C.signName[EN.indexOf(s)]||s}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fd(d){return d.year+'-'+String(d.month).padStart(2,'0')}
function ymd(d){return d.year+'-'+String(d.month).padStart(2,'0')+'-'+String(d.day).padStart(2,'0')}
function nm(g){return g==='Lagna'?'Lagna':(g)}  /* English graha names read faster on the map */
function glyph(g){return g==='Lagna'?'L':(GG[g]||'?')}

/* ---------- circuit map (SVG) ---------- */
var uid=0;
function circuitSVG(chart,sink){
  var f=chart.facts, next=f.dispositors.next, imp={}; f.importance.forEach(function(x){imp[x.g]=x.score});
  var W=300, mem=sink.members.slice();
  // order ring members by following the dispositor links
  if(mem.length>1){var ord=[mem[0]],cur=next[mem[0]];while(ord.length<mem.length&&mem.indexOf(cur)>=0&&ord.indexOf(cur)<0){ord.push(cur);cur=next[cur]} mem=ord}
  var deps=sink.fed.filter(function(x){return sink.members.indexOf(x)<0}), lvl={};
  deps.forEach(function(x){var l=0,c=x;while(mem.indexOf(c)<0&&l<10){c=next[c];l++}lvl[x]=l});
  var maxL=deps.reduce(function(m,x){return Math.max(m,lvl[x])},0);
  var rowH=104, top=(mem.length===1?60:42);
  var pos={}; mem.forEach(function(m,i){pos[m]={x:W*(i+1)/(mem.length+1),y:top}});
  for(var L=1;L<=maxL;L++){
    var group={}; deps.filter(function(x){return lvl[x]===L}).forEach(function(x){(group[next[x]]=group[next[x]]||[]).push(x)});
    Object.keys(group).forEach(function(t){var arr=group[t],cx=pos[t].x;arr.forEach(function(x,i){pos[x]={x:cx+(i-(arr.length-1)/2)*62,y:top+L*rowH}})});
  }
  var r=function(g){var s=imp[g]; if(g==='Lagna') s=3; return Math.max(13,Math.min(25,12+(s||0)*1.0))};
  var maxY=top; Object.keys(pos).forEach(function(k){maxY=Math.max(maxY,pos[k].y+r(k)+30)}); var H=maxY+10;
  var id='ar'+(++uid), out='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(sink.kind==='own'?'Own-sign authority':'Governing circuit')+' diagram">';
  out+='<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"/></marker></defs>';
  function line(a,b){var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,ra=r(a.g)+2,rb=r(b.g)+4;
    return '<path class="edge" marker-end="url(#'+id+')" d="M'+(a.x+dx/d*ra)+' '+(a.y+dy/d*ra)+' L'+(b.x-dx/d*rb)+' '+(b.y-dy/d*rb)+'"/>'}
  var edges='';
  deps.forEach(function(x){var t=next[x],a=pos[x],b=pos[t],ex=b.x+(a.x-b.x)*0.3,ey=b.y+r(t)+31,sx=a.x,sy=a.y-r(x)-2;
    edges+='<path class="edge" marker-end="url(#'+id+')" d="M'+sx+' '+sy+' L'+ex+' '+(ey+4)+'"/>'});
  if(mem.length===1){var p=pos[mem[0]],rr=r(mem[0]);edges+='<path class="edge" marker-end="url(#'+id+')" d="M'+(p.x-rr*0.55)+' '+(p.y-rr*0.85)+' C'+(p.x-rr*1.6)+' '+(p.y-rr*2.6)+' '+(p.x+rr*1.6)+' '+(p.y-rr*2.6)+' '+(p.x+rr*0.55)+' '+(p.y-rr*0.95)+'"/>'}
  else if(mem.length===2){var a=pos[mem[0]],b=pos[mem[1]],ra=r(mem[0]),rb=r(mem[1]);
    edges+='<path class="edge" marker-end="url(#'+id+')" d="M'+(a.x+ra*0.6)+' '+(a.y-ra*0.8)+' Q'+((a.x+b.x)/2)+' '+(top-34)+' '+(b.x-rb*0.6)+' '+(b.y-rb*0.9)+'"/>';
    edges+='<path class="edge" marker-end="url(#'+id+')" d="M'+(b.x-rb*0.6)+' '+(b.y+rb*0.8)+' Q'+((a.x+b.x)/2)+' '+(top+34)+' '+(a.x+ra*0.6)+' '+(a.y+ra*0.9)+'"/>'}
  else{mem.forEach(function(m,i){var n=mem[(i+1)%mem.length];
      if(i<mem.length-1) edges+=line({x:pos[m].x,y:pos[m].y,g:m},{x:pos[n].x,y:pos[n].y,g:n});
      else {var a=pos[m],b=pos[n];edges+='<path class="edge" marker-end="url(#'+id+')" d="M'+(a.x)+' '+(a.y-r(m)-2)+' Q'+((a.x+b.x)/2)+' '+(top-40)+' '+(b.x)+' '+(b.y-r(n)-5)+'"/>'}})}
  out+=edges;
  function node(g,isMem){var p=pos[g],x=f.grahas[g]; var sub=g==='Lagna'?(f.lagna.sign+' rising'):('bhava '+x.house);
    return '<circle class="'+(isMem?'mem':'dep')+'" cx="'+p.x+'" cy="'+p.y+'" r="'+r(g)+'"/><text class="gl" x="'+p.x+'" y="'+(p.y+5.5)+'" text-anchor="middle">'+glyph(g)+'</text>'+
      '<text class="nm" x="'+p.x+'" y="'+(p.y+r(g)+14)+'" text-anchor="middle">'+nm(g)+'</text><text class="sub" x="'+p.x+'" y="'+(p.y+r(g)+26)+'" text-anchor="middle">'+esc(sub)+'</text>'}
  mem.forEach(function(g){out+=node(g,true)}); deps.forEach(function(g){out+=node(g,false)});
  return out+'</svg>';
}
function circuitCard(chart,sink,idx){
  var f=chart.facts, g=f.grahas, mem=sink.members;
  var title= sink.kind==='own' ? ('Own-sign authority: '+mem[0]) : sink.kind==='exchange' ? ('Exchange: '+mem.join(' and ')) : ('Governing loop: '+ (function(){var o=[mem[0]],c=f.dispositors.next[mem[0]];while(o.length<mem.length&&o.indexOf(c)<0){o.push(c);c=f.dispositors.next[c]}return o.join(' to ')+' and back'})());
  var cap= sink.kind==='own' ? mem[0]+' sits in its own sign, so it answers to no one.' : sink.kind==='exchange' ? 'Each sits in the other’s sign, so they answer only to each other.' : 'Each sits in the next one’s sign, so the result passes round the loop.';
  var roles=mem.map(function(m){var x=g[m];return m+' lords '+(x.lordOf.length?x.lordOf.join(' and '):'no house')+', sits in bhava '+x.house+' ('+x.dig.toLowerCase()+')'}).join('. ')+'.';
  var answer=sink.fed.filter(function(x){return mem.indexOf(x)<0});
  return '<div class="circ"><h3>'+esc(title)+'</h3><p class="cap">'+esc(cap)+'</p>'+circuitSVG(chart,sink)+
    '<p class="roles">'+esc(roles)+(answer.length?' <b>Answer to it:</b> '+esc(answer.join(', '))+'.':'')+'</p></div>';
}

/* ---------- person page ---------- */
function importanceHTML(chart){
  var imp=chart.facts.importance, max=imp[0].score||1;
  return '<ul class="bars">'+imp.map(function(x,i){
    var minor=x.score<4;
    return '<li class="'+(minor?'minor':'')+'"><span>'+x.g+'</span><span class="track"><span class="fill" style="display:block;width:'+Math.max(2,Math.round(x.score/max*100))+'%"></span></span><span class="v">'+x.score+'</span></li>'+
      '<li style="display:block;margin:-3px 0 4px"><details class="why"><summary>why this score</summary><ul class="whylist">'+x.why.map(function(w){return '<li>'+esc(w.replace(/^\+/,'+'))+'</li>'}).join('')+'</ul></details></li>'}).join('')+'</ul>';
}
function claimHTML(c){
  return '<article class="claim"><div class="chead"><span class="rk">'+c.rank+'</span><h3>'+esc(c.title)+'<span class="tag '+c.strength+'">'+(c.strength==='leads'?'leads':'supports')+'</span></h3></div>'+
    '<p>'+esc(c.body)+'</p><div class="chips">'+c.evidence.map(function(e){return '<span class="chip">'+esc(e)+'</span>'}).join('')+'</div>'+
    '<p class="test"><b>Test it.</b> '+esc(c.confirm)+'</p></article>';
}
function personHTML(chart){
  var f=chart.facts, e=chart.editorial, b=chart.birth, now=f.dasha.now, mn=f.moonNak;
  if(!e) return '<div class="wait"><b>'+esc(chart.name)+'</b>: computed, no written reading yet.</div>';
  var glance='<ul class="glance"><li><b>Lagna</b> '+sk(f.lagna.sign)+' '+f.lagna.deg+'°</li><li><b>Moon</b> '+sk(f.grahas.Moon.sign)+', '+esc(mn.name)+'-'+mn.pada+'</li><li><b>Mahādaśā</b> '+GN[now[0].lord]+' to '+fd(now[0].e)+'</li><li><b>Antardaśā</b> '+GN[now[1].lord]+' to '+fd(now[1].e)+'</li></ul>';
  var tl='<div class="tablewrap"><table><thead><tr><th>Mahādaśā</th><th>From</th><th>To</th></tr></thead><tbody>'+f.dasha.all.map(function(p){var cur=p.lord===now[0].lord&&ymd(p.s)===ymd(now[0].s);return '<tr'+(cur?' class="now"':'')+'><td>'+GN[p.lord]+(cur?' (running)':'')+'</td><td class="n">'+ymd(p.s)+'</td><td class="n">'+ymd(p.e)+'</td></tr>'}).join('')+'</tbody></table></div>';
  return '<p class="who">'+esc(chart.name)+' · '+esc(b.date)+' · '+esc(b.time)+' · UTC'+(b.tz>=0?'+':'')+b.tz+' · '+esc(b.place)+' · as of '+esc(chart.asOf)+'</p>'+
    '<h1 class="headline">'+esc(e.headline)+'</h1>'+glance+'<p class="thesis">'+esc(e.thesis)+'</p>'+
    '<h2 class="sec">What governs what</h2><p class="secsub">Every graha answers to the lord of the sign it sits in. Following those links ends in a graha that answers to no one, or in a loop. Each end point is a circuit that the others report to.</p>'+
    '<div class="circuits">'+f.dispositors.sinks.map(function(s,i){return circuitCard(chart,s,i)}).join('')+'</div>'+
    '<h2 class="sec">Who carries the chart</h2><p class="secsub">A graha scores for governing others, for being the Lagna lord or the Moon, for running the current period, and for being unusually strong or weak. Below about 4 it is minor.</p>'+importanceHTML(chart)+
    '<h2 class="sec">What the chart says, in order of weight</h2><p class="secsub">Five claims. Each lists the chart facts it rests on and one way to check it against a real life.</p>'+e.claims.map(claimHTML).join('')+
    '<h2 class="sec">Set aside</h2><p class="secsub">Present in the engine’s output, left out of the reading, with the reason.</p><div class="aside">'+e.setAside.map(function(a){return '<div class="a"><b>'+esc(a.what)+'</b><p>'+esc(a.why)+'</p></div>'}).join('')+'</div>'+
    '<h2 class="sec">The clock, and dates to check</h2><p class="secsub">The reading makes these dated predictions. They are the quickest way to see where it is right and where it is not.</p>'+tl+
    '<ul class="hooks">'+e.hooks.map(function(h){return '<li><span class="w">'+esc(h.when)+'</span><span><b>'+esc(h.event)+'.</b> '+esc(h.expect)+'</span></li>'}).join('')+'</ul>';
}

/* ---------- together ---------- */
function togetherHTML(){
  var T=D.together, cs=D.charts.filter(function(c){return c.status==='computed'});
  var rows=[
    ['Lagna',function(c){return sk(c.facts.lagna.sign)+' '+c.facts.lagna.deg+'°'}],
    ['Moon',function(c){return sk(c.facts.grahas.Moon.sign)+' '+c.facts.grahas.Moon.deg+'°, '+c.facts.moonNak.name+'-'+c.facts.moonNak.pada}],
    ['Sun',function(c){var x=c.facts.grahas.Sun;return sk(x.sign)+' '+x.deg+'° ('+x.dig.toLowerCase()+')'}],
    ['Mercury',function(c){var x=c.facts.grahas.Mercury;return sk(x.sign)+' '+x.deg+'° ('+x.dig.toLowerCase()+')'}],
    ['Venus',function(c){var x=c.facts.grahas.Venus;return sk(x.sign)+' '+x.deg+'° ('+x.dig.toLowerCase()+')'}],
    ['What governs',function(c){return c.facts.dispositors.sinks.map(function(s){return (s.kind==='own'?s.members[0]+' (own sign)':s.kind==='exchange'?s.members.join(' + ')+' exchange':s.members.join(' + ')+' loop')+' ← '+(s.fed.length-s.members.length)}).join('; ')}],
    ['Strongest by score',function(c){return c.facts.importance.slice(0,3).map(function(x){return x.g+' '+x.score}).join(', ')}],
    ['Now',function(c){return GN[c.facts.dasha.now[0].lord]+' / '+GN[c.facts.dasha.now[1].lord]+' to '+fd(c.facts.dasha.now[1].e)}]
  ];
  return '<h1 class="headline">'+esc(T.headline)+'</h1><p class="thesis">'+esc(T.intro)+'</p>'+
    '<h2 class="sec">Side by side</h2><div class="tablewrap"><table><thead><tr><th></th>'+cs.map(function(c){return '<th>'+esc(c.name)+'</th>'}).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){return '<tr><th>'+r[0]+'</th>'+cs.map(function(c){return '<td>'+esc(r[1](c))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'+
    '<h2 class="sec">What the three charts share</h2>'+T.observations.map(function(o){return '<div class="obs"><h3>'+esc(o.title)+'</h3><p>'+esc(o.body)+'</p></div>'}).join('');
}

var views=D.charts.map(function(c){return {id:c.id,name:c.name}}); if(D.together) views.push({id:'together',name:'Together'});
var cur=0; try{var sv=localStorage.getItem('jsr2-tab'); if(sv!==null) cur=Math.min(+sv||0,views.length-1)}catch(e){}
function show(i){
  cur=i; try{localStorage.setItem('jsr2-tab',String(i))}catch(e){}
  var v=views[i]; document.getElementById('bar').textContent='Jyotish Story Reader · '+v.name;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b,j){b.setAttribute('aria-selected',j===i?'true':'false')});
  var html; if(v.id==='together') html=togetherHTML(); else { var ch=D.charts.filter(function(c){return c.id===v.id})[0]; html= ch.status==='computed'?personHTML(ch):'<div class="wait"><b>'+esc(ch.name)+'</b> is waiting for birth data.</div>'; }
  document.getElementById('view').innerHTML=html; window.scrollTo(0,0);
}
var tabs=document.getElementById('tabs');
views.forEach(function(v,i){var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=v.name;b.addEventListener('click',function(){show(i)});tabs.appendChild(b)});
document.getElementById('foot').innerHTML=
 '<p><b>How this was made.</b> A chart engine computes positions, houses, dignities, navāṁśa, karakas and daśā. Dispositor links and the importance score are calculated from those facts. The written reading was composed from them and is a set of claims to test, not a forecast. Where the engine’s own yoga list contradicts itself, the page says which items were set aside and why.</p><p><i>Offered as study material, with every good wish for the learning.</i></p>';
show(cur);
})();
</script>
