<title>Jyotish Story Reader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column. Thesis first, then a map of which grahas govern which, then ranked claims, then what was set aside and how to test it. */
:root{
  --strip:#e6e9cf; --left:#fdeedd; --right:#fffbf4; --ink:#211c17; --mute:#6a5d50; --rule:#d2c3b0;
  --link:#1b3fa8; --head:#7b2b8f; --hl:#fff1a0; --plum:#2a1830; --pink:#d9758f;
  --good:#2b6a38; --warn:#9b3a1c; --card:#fffdf9; --soft:#f6e6d3;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --strip:#2b2f21; --left:#2a2018; --right:#211c18; --ink:#efe5d8; --mute:#b3a493; --rule:#4a3d31;
  --link:#93b3ff; --head:#d9a2f0; --hl:#5b4e12; --plum:#160c1b; --pink:#c4607c;
  --good:#7fcf8e; --warn:#f09a78; --card:#2a221c; --soft:#2d231b; color-scheme:dark } }
:root[data-theme="dark"]{
  --strip:#2b2f21; --left:#2a2018; --right:#211c18; --ink:#efe5d8; --mute:#b3a493; --rule:#4a3d31;
  --link:#93b3ff; --head:#d9a2f0; --hl:#5b4e12; --plum:#160c1b; --pink:#c4607c;
  --good:#7fcf8e; --warn:#f09a78; --card:#2a221c; --soft:#2d231b; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--right);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6;margin:0}
.bar{background:var(--strip);border-bottom:1px solid var(--rule);text-align:center;font-size:13px;padding:9px 16px;letter-spacing:.02em}
.page{display:grid;grid-template-columns:clamp(14px,3.2vw,36px) minmax(0,1fr);max-width:1000px;margin:0 auto}
.floral{background:
  radial-gradient(circle at 32% 22%,var(--pink) 0 3px,transparent 4px) 0 0/24px 30px,
  radial-gradient(circle at 70% 68%,var(--pink) 0 2px,transparent 3px) 0 0/24px 30px, var(--plum)}
main{min-width:0;padding-inline:16px;padding-block:18px 40px}
h1,h2,h3{font-weight:600;text-wrap:balance;margin:0;line-height:1.25}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-block:0 18px}
.tabs button{font:inherit;font-size:14px;padding:7px 15px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;border-radius:3px}
.tabs button[aria-selected="true"]{background:var(--head);color:#fff;border-color:var(--head)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.who{font-family:var(--mono);font-size:12.5px;color:var(--mute);margin:0 0 6px}
.headline{font-size:clamp(24px,5vw,33px);color:var(--head);margin-bottom:12px;max-width:26ch}
.glance{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0 0 14px;padding:0;list-style:none;font-size:14px}
.glance b{font-weight:600}
.thesis{font-size:17.5px;line-height:1.62;max-width:64ch;margin:0 0 4px}
h2.sec{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:34px 0 4px}
.secsub{margin:0 0 14px;color:var(--mute);font-style:italic;max-width:62ch}
.circuits{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}
.circ{background:var(--card);border:1px solid var(--rule);padding:12px 12px 10px;min-width:0}
.circ h3{font-size:15.5px;color:var(--head)}
.circ .cap{font-size:13.5px;color:var(--mute);margin:3px 0 6px}
.circ svg{display:block;width:100%;height:auto;max-width:100%}
.circ .roles{font-size:13.5px;margin:6px 0 0}
svg text{font-family:var(--serif);fill:var(--ink)}
svg .sub{fill:var(--mute);font-size:10.5px}
svg .nm{font-size:11.5px}
svg .gl{font-size:16px}
svg .mem{fill:var(--card);stroke:var(--head);stroke-width:2.2}
svg .dep{fill:var(--soft);stroke:var(--mute);stroke-width:1}
svg .edge{fill:none;stroke:var(--mute);stroke-width:1.4}
svg .arrow{fill:var(--mute)}
.bars{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:5.2rem minmax(0,1fr) 2.6rem;gap:10px;align-items:center;font-size:14.5px}
.bars .track{background:var(--soft);height:10px;border:1px solid var(--rule)}
.bars .fill{background:var(--head);height:100%}
.bars .v{font-family:var(--mono);font-size:12.5px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.bars li.minor .fill{background:var(--mute)}
details.why{margin:2px 0 0 0}
summary{font-family:var(--mono);font-size:12px;color:var(--link);cursor:pointer;width:max-content;max-width:100%}
.whylist{margin:6px 0 0;padding-left:1.1em;font-size:13.5px;color:var(--mute)}
.claim{padding:16px 0 18px;border-top:1px solid var(--rule)}
.claim:first-of-type{border-top:2px solid var(--ink)}
.chead{display:flex;gap:12px;align-items:baseline}
.rk{font-family:var(--mono);font-size:13px;color:var(--mute);min-width:1.6rem;font-variant-numeric:tabular-nums}
.claim h3{font-size:20px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border:1px solid var(--rule);color:var(--mute);margin-left:8px;vertical-align:2px;white-space:nowrap}
.tag.leads{border-color:var(--head);color:var(--head)}
.claim p{margin:8px 0 0;max-width:66ch;padding-left:calc(1.6rem + 12px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 calc(1.6rem + 12px)}
.chip{font-family:var(--mono);font-size:11.5px;padding:2px 8px;background:var(--soft);border:1px solid var(--rule);color:var(--ink);max-width:100%}
.test{margin:10px 0 0 calc(1.6rem + 12px);font-size:14px;color:var(--mute);max-width:64ch}
.test b{color:var(--ink);font-weight:600}
.aside{background:var(--left);border:1px solid var(--rule);padding:6px 14px}
.aside .a{padding:9px 0;border-top:1px solid var(--rule)}
.aside .a:first-child{border-top:0}
.aside b{font-weight:600}
.aside .a p{margin:2px 0 0;font-size:14.5px;color:var(--mute);max-width:66ch}
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:14px;width:100%;min-width:520px}
th,td{text-align:left;padding:5px 12px 5px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.now td{background:var(--hl)}
.hooks{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.hooks li{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:12px;font-size:14.5px}
.hooks .w{font-family:var(--mono);font-size:12.5px;color:var(--mute)}
.obs{padding:14px 0;border-top:1px solid var(--rule)}
.obs h3{font-size:18px}
.obs p{margin:6px 0 0;max-width:66ch}
.wait{background:var(--card);border:1px solid var(--rule);padding:14px}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);color:var(--mute);font-size:13.5px}
footer p{max-width:70ch;margin:0 0 8px}
@media (max-width:640px){
  .claim p,.chips,.test{padding-left:0;margin-left:0}
  .claim p{padding-left:0}
  .hooks li{grid-template-columns:minmax(0,1fr);gap:2px}
  .bars li{grid-template-columns:4.4rem minmax(0,1fr) 2.4rem}
}
</style>

<div class="bar" id="bar">Jyotish Story Reader</div>
<div class="page"><div class="floral" aria-hidden="true"></div>
<main>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
  <footer id="foot"></footer>
</main></div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent), C=D.content, GN=C.grahaName, GG=C.grahaGlyph;
var EN=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
function sk(s){return C.signName[EN.indexOf(s)]||s}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fd(d){return d.year+'-'+String(d.month).padStart(2,'0')}
function ymd(d){return d.year+'-'+String(d.month).padStart(2,'0')+'-'+String(d.day).padStart(2,'0')}
function nm(g){return g==='Lagna'?'Lagna':(g)}  /* English graha names read faster on the map */
function glyph(g){return g==='Lagna'?'L':(GG[g]||'?')}

/* ---------- circuit map (SVG) ---------- */
var uid=0;
function circuitSVG(chart,sink){
  var f=chart.facts, next=f.dispositors.next, imp={}; f.importance.forEach(function(x){imp[x.g]=x.score});
  var W=300, mem=sink.members.slice();
  // order ring members by following the dispositor links
  if(mem.length>1){var ord=[mem[0]],cur=next[mem[0]];while(ord.length<mem.length&&mem.indexOf(cur)>=0&&ord.indexOf(cur)<0){ord.push(cur);cur=next[cur]} mem=ord}
  var deps=sink.fed.filter(function(x){return sink.members.indexOf(x)<0}), lvl={};
  deps.forEach(function(x){var l=0,c=x;while(mem.indexOf(c)<0&&l<10){c=next[c];l++}lvl[x]=l});
  var maxL=deps.reduce(function(m,x){return Math.max(m,lvl[x])},0);
  var rowH=104, top=(mem.length===1?60:42);
  var pos={}; mem.forEach(function(m,i){pos[m]={x:W*(i+1)/(mem.length+1),y:top}});
  for(var L=1;L<=maxL;L++){
    var group={}; deps.filter(function(x){return lvl[x]===L}).forEach(function(x){(group[next[x]]=group[next[x]]||[]).push(x)});
    Object.keys(group).forEach(function(t){var arr=group[t],cx=pos[t].x;arr.forEach(function(x,i){pos[x]={x:cx+(i-(arr.length-1)/2)*62,y:top+L*rowH}})});
  }
  var r=function(g){var s=imp[g]; if(g==='Lagna') s=3; return Math.max(13,Math.min(25,12+(s||0)*1.0))};
  var maxY=top; Object.keys(pos).forEach(function(k){maxY=Math.max(maxY,pos[k].y+r(k)+30)}); var H=maxY+10;
  var id='ar'+(++uid), out='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(sink.kind==='own'?'Own-sign authority':'Governing circuit')+' diagram">';
  out+='<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"/></marker></defs>';
  function line(a,b){var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,ra=r(a.g)+2,rb=r(b.g)+4;
    return '<path class="edge" marker-end="url(#'+id+')" d="M'+(a.x+dx/d*ra)+' '+(a.y+dy/d*ra)+' L'+(b.x-dx/d*rb)+' '+(b.y-dy/d*rb)+'"/>'}
  var edges='';
  deps.forEach(function(x){var t=next[x],a=pos[x],b=pos[t],ex=b.x+(a.x-b.x)*0.3,ey=b.y+r(t)+31,sx=a.x,sy=a.y-r(x)-2;
    edges+='<path class="edge" marker-end="url(#'+id+')" d="M'+sx+' '+sy+' L'+ex+' '+(ey+4)+'"/>'});
  if(mem.length===1){var p=pos[mem[0]],rr=r(mem[0]);edges+='<path class="edge" marker-end="url(#'+id+')" d="M'+(p.x-rr*0.55)+' '+(p.y-rr*0.85)+' C'+(p.x-rr*1.6)+' '+(p.y-rr*2.6)+' '+(p.x+rr*1.6)+' '+(p.y-rr*2.6)+' '+(p.x+rr*0.55)+' '+(p.y-rr*0.95)+'"/>'}
  else if(mem.length===2){var a=pos[mem[0]],b=pos[mem[1]],ra=r(mem[0]),rb=r(mem[1]);
    edges+='<path class="edge" marker-end="url(#'+id+')" d="M'+(a.x+ra*0.6)+' '+(a.y-ra*0.8)+' Q'+((a.x+b.x)/2)+' '+(top-34)+' '+(b.x-rb*0.6)+' '+(b.y-rb*0.9)+'"/>';
    edges+='<path class="edge" marker-end="url(#'+id+')" d="M'+(b.x-rb*0.6)+' '+(b.y+rb*0.8)+' Q'+((a.x+b.x)/2)+' '+(top+34)+' '+(a.x+ra*0.6)+' '+(a.y+ra*0.9)+'"/>'}
  else{mem.forEach(function(m,i){var n=mem[(i+1)%mem.length];
      if(i<mem.length-1) edges+=line({x:pos[m].x,y:pos[m].y,g:m},{x:pos[n].x,y:pos[n].y,g:n});
      else {var a=pos[m],b=pos[n];edges+='<path class="edge" marker-end="url(#'+id+')" d="M'+(a.x)+' '+(a.y-r(m)-2)+' Q'+((a.x+b.x)/2)+' '+(top-40)+' '+(b.x)+' '+(b.y-r(n)-5)+'"/>'}})}
  out+=edges;
  function node(g,isMem){var p=pos[g],x=f.grahas[g]; var sub=g==='Lagna'?(f.lagna.sign+' rising'):('bhava '+x.house);
    return '<circle class="'+(isMem?'mem':'dep')+'" cx="'+p.x+'" cy="'+p.y+'" r="'+r(g)+'"/><text class="gl" x="'+p.x+'" y="'+(p.y+5.5)+'" text-anchor="middle">'+glyph(g)+'</text>'+
      '<text class="nm" x="'+p.x+'" y="'+(p.y+r(g)+14)+'" text-anchor="middle">'+nm(g)+'</text><text class="sub" x="'+p.x+'" y="'+(p.y+r(g)+26)+'" text-anchor="middle">'+esc(sub)+'</text>'}
  mem.forEach(function(g){out+=node(g,true)}); deps.forEach(function(g){out+=node(g,false)});
  return out+'</svg>';
}
function circuitCard(chart,sink,idx){
  var f=chart.facts, g=f.grahas, mem=sink.members;
  var title= sink.kind==='own' ? ('Own-sign authority: '+mem[0]) : sink.kind==='exchange' ? ('Exchange: '+mem.join(' and ')) : ('Governing loop: '+ (function(){var o=[mem[0]],c=f.dispositors.next[mem[0]];while(o.length<mem.length&&o.indexOf(c)<0){o.push(c);c=f.dispositors.next[c]}return o.join(' to ')+' and back'})());
  var cap= sink.kind==='own' ? mem[0]+' sits in its own sign, so it answers to no one.' : sink.kind==='exchange' ? 'Each sits in the other’s sign, so they answer only to each other.' : 'Each sits in the next one’s sign, so the result passes round the loop.';
  var roles=mem.map(function(m){var x=g[m];return m+' lords '+(x.lordOf.length?x.lordOf.join(' and '):'no house')+', sits in bhava '+x.house+' ('+x.dig.toLowerCase()+')'}).join('. ')+'.';
  var answer=sink.fed.filter(function(x){return mem.indexOf(x)<0});
  return '<div class="circ"><h3>'+esc(title)+'</h3><p class="cap">'+esc(cap)+'</p>'+circuitSVG(chart,sink)+
    '<p class="roles">'+esc(roles)+(answer.length?' <b>Answer to it:</b> '+esc(answer.join(', '))+'.':'')+'</p></div>';
}

/* ---------- person page ---------- */
function importanceHTML(chart){
  var imp=chart.facts.importance, max=imp[0].score||1;
  return '<ul class="bars">'+imp.map(function(x,i){
    var minor=x.score<4;
    return '<li class="'+(minor?'minor':'')+'"><span>'+x.g+'</span><span class="track"><span class="fill" style="display:block;width:'+Math.max(2,Math.round(x.score/max*100))+'%"></span></span><span class="v">'+x.score+'</span></li>'+
      '<li style="display:block;margin:-3px 0 4px"><details class="why"><summary>why this score</summary><ul class="whylist">'+x.why.map(function(w){return '<li>'+esc(w.replace(/^\+/,'+'))+'</li>'}).join('')+'</ul></details></li>'}).join('')+'</ul>';
}
function claimHTML(c){
  return '<article class="claim"><div class="chead"><span class="rk">'+c.rank+'</span><h3>'+esc(c.title)+'<span class="tag '+c.strength+'">'+(c.strength==='leads'?'leads':'supports')+'</span></h3></div>'+
    '<p>'+esc(c.body)+'</p><div class="chips">'+c.evidence.map(function(e){return '<span class="chip">'+esc(e)+'</span>'}).join('')+'</div>'+
    '<p class="test"><b>Test it.</b> '+esc(c.confirm)+'</p></article>';
}
function personHTML(chart){
  var f=chart.facts, e=chart.editorial, b=chart.birth, now=f.dasha.now, mn=f.moonNak;
  if(!e) return '<div class="wait"><b>'+esc(chart.name)+'</b>: computed, no written reading yet.</div>';
  var glance='<ul class="glance"><li><b>Lagna</b> '+sk(f.lagna.sign)+' '+f.lagna.deg+'°</li><li><b>Moon</b> '+sk(f.grahas.Moon.sign)+', '+esc(mn.name)+'-'+mn.pada+'</li><li><b>Mahādaśā</b> '+GN[now[0].lord]+' to '+fd(now[0].e)+'</li><li><b>Antardaśā</b> '+GN[now[1].lord]+' to '+fd(now[1].e)+'</li></ul>';
  var tl='<div class="tablewrap"><table><thead><tr><th>Mahādaśā</th><th>From</th><th>To</th></tr></thead><tbody>'+f.dasha.all.map(function(p){var cur=p.lord===now[0].lord&&ymd(p.s)===ymd(now[0].s);return '<tr'+(cur?' class="now"':'')+'><td>'+GN[p.lord]+(cur?' (running)':'')+'</td><td class="n">'+ymd(p.s)+'</td><td class="n">'+ymd(p.e)+'</td></tr>'}).join('')+'</tbody></table></div>';
  return '<p class="who">'+esc(chart.name)+' · '+esc(b.date)+' · '+esc(b.time)+' · UTC'+(b.tz>=0?'+':'')+b.tz+' · '+esc(b.place)+' · as of '+esc(chart.asOf)+'</p>'+
    '<h1 class="headline">'+esc(e.headline)+'</h1>'+glance+'<p class="thesis">'+esc(e.thesis)+'</p>'+
    '<h2 class="sec">What governs what</h2><p class="secsub">Every graha answers to the lord of the sign it sits in. Following those links ends in a graha that answers to no one, or in a loop. Each end point is a circuit that the others report to.</p>'+
    '<div class="circuits">'+f.dispositors.sinks.map(function(s,i){return circuitCard(chart,s,i)}).join('')+'</div>'+
    '<h2 class="sec">Who carries the chart</h2><p class="secsub">A graha scores for governing others, for being the Lagna lord or the Moon, for running the current period, and for being unusually strong or weak. Below about 4 it is minor.</p>'+importanceHTML(chart)+
    '<h2 class="sec">What the chart says, in order of weight</h2><p class="secsub">Five claims. Each lists the chart facts it rests on and one way to check it against a real life.</p>'+e.claims.map(claimHTML).join('')+
    '<h2 class="sec">Set aside</h2><p class="secsub">Present in the engine’s output, left out of the reading, with the reason.</p><div class="aside">'+e.setAside.map(function(a){return '<div class="a"><b>'+esc(a.what)+'</b><p>'+esc(a.why)+'</p></div>'}).join('')+'</div>'+
    '<h2 class="sec">The clock, and dates to check</h2><p class="secsub">The reading makes these dated predictions. They are the quickest way to see where it is right and where it is not.</p>'+tl+
    '<ul class="hooks">'+e.hooks.map(function(h){return '<li><span class="w">'+esc(h.when)+'</span><span><b>'+esc(h.event)+'.</b> '+esc(h.expect)+'</span></li>'}).join('')+'</ul>';
}

/* ---------- together ---------- */
function togetherHTML(){
  var T=D.together, cs=D.charts.filter(function(c){return c.status==='computed'});
  var rows=[
    ['Lagna',function(c){return sk(c.facts.lagna.sign)+' '+c.facts.lagna.deg+'°'}],
    ['Moon',function(c){return sk(c.facts.grahas.Moon.sign)+' '+c.facts.grahas.Moon.deg+'°, '+c.facts.moonNak.name+'-'+c.facts.moonNak.pada}],
    ['Sun',function(c){var x=c.facts.grahas.Sun;return sk(x.sign)+' '+x.deg+'° ('+x.dig.toLowerCase()+')'}],
    ['Mercury',function(c){var x=c.facts.grahas.Mercury;return sk(x.sign)+' '+x.deg+'° ('+x.dig.toLowerCase()+')'}],
    ['Venus',function(c){var x=c.facts.grahas.Venus;return sk(x.sign)+' '+x.deg+'° ('+x.dig.toLowerCase()+')'}],
    ['What governs',function(c){return c.facts.dispositors.sinks.map(function(s){return (s.kind==='own'?s.members[0]+' (own sign)':s.kind==='exchange'?s.members.join(' + ')+' exchange':s.members.join(' + ')+' loop')+' ← '+(s.fed.length-s.members.length)}).join('; ')}],
    ['Strongest by score',function(c){return c.facts.importance.slice(0,3).map(function(x){return x.g+' '+x.score}).join(', ')}],
    ['Now',function(c){return GN[c.facts.dasha.now[0].lord]+' / '+GN[c.facts.dasha.now[1].lord]+' to '+fd(c.facts.dasha.now[1].e)}]
  ];
  return '<h1 class="headline">'+esc(T.headline)+'</h1><p class="thesis">'+esc(T.intro)+'</p>'+
    '<h2 class="sec">Side by side</h2><div class="tablewrap"><table><thead><tr><th></th>'+cs.map(function(c){return '<th>'+esc(c.name)+'</th>'}).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){return '<tr><th>'+r[0]+'</th>'+cs.map(function(c){return '<td>'+esc(r[1](c))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'+
    '<h2 class="sec">What the three charts share</h2>'+T.observations.map(function(o){return '<div class="obs"><h3>'+esc(o.title)+'</h3><p>'+esc(o.body)+'</p></div>'}).join('');
}

var views=D.charts.map(function(c){return {id:c.id,name:c.name}}); if(D.together) views.push({id:'together',name:'Together'});
var cur=0; try{var sv=localStorage.getItem('jsr2-tab'); if(sv!==null) cur=Math.min(+sv||0,views.length-1)}catch(e){}
function show(i){
  cur=i; try{localStorage.setItem('jsr2-tab',String(i))}catch(e){}
  var v=views[i]; document.getElementById('bar').textContent='Jyotish Story Reader · '+v.name;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b,j){b.setAttribute('aria-selected',j===i?'true':'false')});
  var html; if(v.id==='together') html=togetherHTML(); else { var ch=D.charts.filter(function(c){return c.id===v.id})[0]; html= ch.status==='computed'?personHTML(ch):'<div class="wait"><b>'+esc(ch.name)+'</b> is waiting for birth data.</div>'; }
  document.getElementById('view').innerHTML=html; window.scrollTo(0,0);
}
var tabs=document.getElementById('tabs');
views.forEach(function(v,i){var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=v.name;b.addEventListener('click',function(){show(i)});tabs.appendChild(b)});
document.getElementById('foot').innerHTML=
 '<p><b>How this was made.</b> A chart engine computes positions, houses, dignities, navāṁśa, karakas and daśā. Dispositor links and the importance score are calculated from those facts. The written reading was composed from them and is a set of claims to test, not a forecast. Where the engine’s own yoga list contradicts itself, the page says which items were set aside and why.</p><p><i>Offered as study material, with every good wish for the learning.</i></p>';
show(cur);
})();
</script>
