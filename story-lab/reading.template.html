<title>Jyotish Story Reader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a two-column study page — clause strip on the left, narrative and ledger on the right — inside a sage title bar and a floral margin, after the case-method pages this app studies. */
:root{
  --strip:#e6e9cf; --left:#fdeedd; --right:#fffbf4; --ink:#211c17; --mute:#6a5d50; --rule:#d2c3b0;
  --link:#1b3fa8; --head:#7b2b8f; --hl:#fff1a0; --plum:#2a1830; --pink:#d9758f;
  --good:#2b6a38; --warn:#9b3a1c; --fig-a:#f3d7c4; --fig-b:#e9c3d3; --card:#fffdf9;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --strip:#2b2f21; --left:#2a2018; --right:#211c18; --ink:#efe5d8; --mute:#b3a493; --rule:#4a3d31;
  --link:#93b3ff; --head:#d9a2f0; --hl:#5b4e12; --plum:#160c1b; --pink:#c4607c;
  --good:#7fcf8e; --warn:#f09a78; --fig-a:#43302a; --fig-b:#3b2736; --card:#261f1a; color-scheme:dark } }
:root[data-theme="dark"]{
  --strip:#2b2f21; --left:#2a2018; --right:#211c18; --ink:#efe5d8; --mute:#b3a493; --rule:#4a3d31;
  --link:#93b3ff; --head:#d9a2f0; --hl:#5b4e12; --plum:#160c1b; --pink:#c4607c;
  --good:#7fcf8e; --warn:#f09a78; --fig-a:#43302a; --fig-b:#3b2736; --card:#261f1a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--right);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.58;margin:0}
.bar{background:var(--strip);border-bottom:1px solid var(--rule);text-align:center;font-size:13px;padding:9px 16px;letter-spacing:.02em}
.page{display:grid;grid-template-columns:clamp(14px,3.2vw,36px) minmax(0,1fr);max-width:1180px;margin:0 auto}
.floral{background:
  radial-gradient(circle at 32% 22%,var(--pink) 0 3px,transparent 4px) 0 0/24px 30px,
  radial-gradient(circle at 70% 68%,var(--pink) 0 2px,transparent 3px) 0 0/24px 30px,
  radial-gradient(circle at 50% 100%,transparent 0 6px,var(--plum) 7px) 0 0/24px 30px, var(--plum)}
main{min-width:0;padding-inline:16px;padding-block:18px 36px}
h1,h2,h3{font-weight:600;text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.2}
h2{font-size:21px;color:var(--head);line-height:1.25}
h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.sub{color:var(--mute);font-style:italic;margin:2px 0 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-block:14px 6px}
.tabs button{font:inherit;font-size:14px;padding:7px 14px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;border-radius:3px}
.tabs button[aria-selected="true"]{background:var(--head);color:#fff;border-color:var(--head)}
.tabs button:focus-visible,summary:focus-visible,label.fig:focus-within{outline:2px solid var(--link);outline-offset:2px}
.birth{font-family:var(--mono);font-size:12.5px;color:var(--mute);margin:8px 0 0}
.glance{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;padding:0;list-style:none}
.glance li{font-size:14px}
.glance b{font-weight:600}
.box{border:1px solid var(--rule);background:var(--card);padding:12px 14px;margin-block:16px}
.box h3{margin-bottom:6px}
.prologue{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.prologue li{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr);gap:10px;align-items:baseline}
.prologue b{color:var(--head);font-weight:600}
.badge{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border:1px solid var(--rule);color:var(--mute);margin-left:6px;white-space:nowrap}
.badge.divergent{border-color:var(--warn);color:var(--warn)}
.badge.convergent{border-color:var(--good);color:var(--good)}
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:13.5px;width:100%;min-width:560px}
th,td{text-align:left;padding:4px 10px 4px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600}
td.n{font-variant-numeric:tabular-nums}
.chapter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);margin-top:26px;border-top:1px solid var(--rule)}
.col-l{background:var(--left);padding:14px 16px;font-size:13.5px;min-width:0}
.col-r{background:var(--right);padding:14px 16px;min-width:0}
.col-l p{margin:0 0 9px}
.cl{margin:0 0 9px;text-indent:-.9em;padding-left:.9em}
.cl .br{color:var(--mute)}
.look{margin-top:14px;padding-top:10px;border-top:1px solid var(--rule)}
.look ul{margin:4px 0 0;padding-left:1.1em}
.fig{float:right;width:min(46%,210px);margin:0 0 8px 14px;display:block;cursor:pointer}
.fig .art{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--fig-a),var(--fig-b));border:1px solid var(--rule)}
.fig .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fig .glyph{font-size:68px;line-height:1;color:var(--head);opacity:.85}
.fig .sg{position:absolute;right:8px;bottom:6px;font-size:22px;color:var(--mute)}
.fig .slot{position:absolute;left:8px;top:6px;font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.fig figcaption{font-style:italic;font-size:12.5px;line-height:1.35;margin-top:5px;color:var(--mute)}
.star{font-weight:700;margin:10px 0 8px}
.col-r p.story{margin:8px 0 12px}
.lensname{margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;clear:both}
.lensname h3{font-size:12.5px}
.verdict{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.verdict.supportive{color:var(--good)} .verdict.strained{color:var(--warn)}
.f{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:4px;padding:6px 0;border-top:1px solid var(--rule)}
.f .pg{font-family:var(--mono);font-size:13px;text-align:center}
.f .pg.p{color:var(--good)} .f .pg.n{color:var(--warn)} .f .pg.z{color:var(--mute)}
.f .t{font-size:14px}
.f .cav{font-size:12.5px;color:var(--mute);font-style:italic;margin-top:2px}
details{margin-top:3px}
summary{font-family:var(--mono);font-size:11.5px;color:var(--link);cursor:pointer;width:max-content;max-width:100%}
.rc{margin:4px 0 2px;padding-left:1.1em;font-family:var(--mono);font-size:12px;color:var(--mute)}
.term{color:var(--link);text-decoration:underline dotted;text-underline-offset:2px}
mark{background:var(--hl);color:inherit}
.timeline{margin-top:10px}
.now td{background:var(--hl)}
.wait .why{max-width:60ch}
.cmd{font-family:var(--mono);font-size:12.5px;background:var(--card);border:1px solid var(--rule);padding:8px 10px;overflow-x:auto;max-width:100%;white-space:pre}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);color:var(--mute);font-size:13.5px}
footer p{max-width:70ch;margin:0 0 8px}
@media (max-width:760px){
  .chapter{grid-template-columns:minmax(0,1fr)}
  .col-r{order:-1}
  .prologue li{grid-template-columns:minmax(0,1fr)}
  .fig{width:min(44%,170px)}
}
@media (prefers-reduced-motion:no-preference){ .tabs button{transition:background .15s} }
</style>

<div class="bar" id="bar">Jyotish Story Reader</div>
<div class="page"><div class="floral" aria-hidden="true"></div>
<main>
  <h1>Chart story, read through three lenses</h1>
  <p class="sub">Each chapter lists what every lens found, with the chart fact behind each sentence. Where lenses disagree, both are shown.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
  <footer id="foot"></footer>
</main></div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var C=D.content, GN=C.grahaName, GG=C.grahaGlyph;
var GRAHAS=['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn','Rahu','Ketu'];
var SKR=['Mesha','Vṛṣabha','Mithuna','Karkaṭa','Siṁha','Kanyā','Tulā','Vṛścika','Dhanus','Makara','Kumbha','Mīna'];
var EN=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
function sk(sign){return C.signName[EN.indexOf(sign)]||sign}
function sg(sign){return C.signGlyph[EN.indexOf(sign)]||''}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fd(d){return d.year+'-'+String(d.month).padStart(2,'0')+'-'+String(d.day).padStart(2,'0')}
var LENS={};D.lenses.forEach(function(l){LENS[l.id]=l});
var TERMS=Object.keys(GN).map(function(k){return GN[k]}).filter(function(v,i,a){return a.indexOf(v)===i});
function terms(chart,t){
  var s=esc(t);
  TERMS.forEach(function(n){
    var g=GRAHAS.filter(function(k){return GN[k]===n})[0], x=chart.facts.grahas[g];
    var tip=x?(n+': '+sk(x.sign)+' '+x.deg+'°, bhava '+x.house+', '+x.dig):n;
    s=s.replace(new RegExp('\\b'+n+'\\b','g'),'<span class="term" title="'+esc(tip)+'">'+n+'</span>');
  });
  return s;
}
function firstSentence(t){var m=t.match(/^.*?[.!?](?=\s|$)/);return m?m[0]:t}
var FOCUS={
  self:function(f){var g='Saturn';return g},
  home:function(){return 'Moon'}, creative:function(f){return f.houses[5].lord}, vocation:function(f){return f.houses[10].lord},
  crucible:function(f){return f.houses[8].occupants[0]||'Ketu'}, partnership:function(){return 'Venus'}, gains:function(){return 'Jupiter'},
  timing:function(f){return f.dasha.now[0].lord}
};
function focusOf(ch,f){ if(ch.id==='self') return f.houses[1].lord; return FOCUS[ch.id](f) }
function pick(findings){
  var rank=function(x){return (x.polarity!==0?10:0)+x.weight};
  var sorted=findings.slice().sort(function(a,b){return rank(b)-rank(a)});
  var out=[],seen={};
  sorted.forEach(function(x){ if(out.length<3 && !seen[x.lens]){seen[x.lens]=1;out.push(x)} });
  sorted.forEach(function(x){ if(out.length<3 && out.indexOf(x)<0) out.push(x) });
  return out;
}
var AGLABEL={convergent:'lenses agree','divergent':'lenses differ','single-lens':'one lens spoke',descriptive:'portrait'};
var PG={1:['▲','p','supportive'],'-1':['▼','n','strained'],0:['◆','z','descriptive']};

function chapterHTML(chart,ch){
  var f=chart.facts, g=focusOf(ch,f), x=f.grahas[g];
  var cap='Tracing '+GN[g].toUpperCase()+' in '+sk(x.sign).toUpperCase()+'-RASHI, bhava-'+x.house;
  var tell=pick(ch.findings);
  var star='';
  var ms=ch.findings.filter(function(z){return z.id==='MOON-SIGN'})[0];
  if(ms){ star='<p class="star">* '+esc(ms.clause.replace(/^\[Chandra in classroom of [^\]]*\]\s*\[/,'').replace(/\]$/,'').split(', ').join(' * '))+'</p>' }
  var story=tell.length?('<p class="story"><b>In general,</b> '+tell.map(function(z){return terms(chart,z.beat)}).join(' ')+'</p>'):'<p class="story">No rule spoke for this chapter on this chart.</p>';
  var lensRows='';
  D.lenses.forEach(function(l){
    var mine=ch.findings.filter(function(z){return z.lens===l.id}); var bl=ch.byLens[l.id];
    if(!mine.length){lensRows+='<div class="lensname"><h3>'+esc(l.name)+'</h3><span class="verdict">silent on this chapter</span></div>';return}
    lensRows+='<div class="lensname"><h3>'+esc(l.name)+'</h3><span class="verdict '+bl.verdict+'">'+bl.verdict+' ('+(bl.score>0?'+':'')+bl.score+')'+(bl.tension?' · pulls both ways':'')+'</span></div>';
    mine.forEach(function(z){
      var pg=PG[z.polarity];
      lensRows+='<div class="f"><div class="pg '+pg[1]+'" title="'+pg[2]+'">'+pg[0]+'</div><div><div class="t">'+terms(chart,z.beat)+'</div>'+
        (z.caveat?'<div class="cav">'+esc(z.caveat)+'</div>':'')+
        '<details><summary>chart facts ('+z.receipts.length+')</summary><ul class="rc">'+z.receipts.map(function(r){return '<li>'+esc(r)+'</li>'}).join('')+'</ul></details></div></div>';
    });
  });
  var checks=[]; ch.findings.forEach(function(z){z.check.forEach(function(c){if(checks.indexOf(c)<0)checks.push(c)})});
  var corpus='';
  if(ch.id==='home' && chart.corpusTags && chart.corpusTags.length){
    corpus='<div class="look"><h3>Case-method cross-check</h3><p>Tags the study corpus holds for this Moon pāda, tested against this chart:</p>'+
      chart.corpusTags.map(function(t){var m=t.matches===true?'matches here':t.matches===false?'does not match here':'not tested';
        return '<p class="cl"><span class="br">[</span>'+esc(t.tag.replace(/\]\s*\[/g,'] [').replace(/^\S*\s*-?\d\]\s*/,'').replace(/^\+\s*/,''))+'<span class="br">]</span> <i>('+m+')</i></p>'}).join('')+'</div>';
  }
  var clauses=ch.findings.map(function(z){return '<p class="cl">'+esc(z.clause).replace(/\[/g,'<span class="br">[</span>').replace(/\]/g,'<span class="br">]</span>')+'</p>'}).join('');
  var ag=ch.agreement;
  var agNote=ag==='divergent'?'<p><mark>Lenses differ here.</mark> '+esc(D.agreement.divergent.charAt(0).toUpperCase()+D.agreement.divergent.slice(1))+'.</p>':'';
  var timeline='';
  if(ch.id==='timing'){
    var now=f.dasha.now[0];
    timeline='<div class="timeline tablewrap"><table><thead><tr><th>Mahādaśā</th><th>From</th><th>To</th></tr></thead><tbody>'+
      f.dasha.all.map(function(p){var cur=p.lord===now.lord&&fd(p.s)===fd(now.s);return '<tr'+(cur?' class="now"':'')+'><td>'+GN[p.lord]+(cur?' · running':'')+'</td><td class="n">'+fd(p.s)+'</td><td class="n">'+fd(p.e)+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  return '<section class="chapter" id="ch-'+ch.id+'"><div class="col-l">'+
    '<h3>Clause strip</h3><div style="margin-top:6px">'+clauses+'</div>'+
    (checks.length?'<div class="look"><h3>Look also to</h3><ul>'+checks.map(function(c){return '<li>'+terms(chart,c)+'</li>'}).join('')+'</ul></div>':'')+corpus+
    '</div><div class="col-r">'+
    '<label class="fig" for="img-'+ch.id+'"><input id="img-'+ch.id+'" type="file" accept="image/*" hidden><div class="art"><span class="slot">reference image</span><span class="glyph">'+(GG[g]||'')+'</span><span class="sg">'+sg(x.sign)+'</span></div><figcaption>'+esc(cap)+'</figcaption></label>'+
    '<h2>'+esc(ch.title)+'<span class="badge '+ag+'">'+AGLABEL[ag]+'</span></h2><p class="sub">'+esc(ch.sub)+'</p>'+star+story+agNote+timeline+lensRows+
    '</div></section>';
}

function computedHTML(chart){
  var f=chart.facts, b=chart.birth, mn=f.moonNak, now=f.dasha.now;
  var glance='<ul class="glance">'+
    '<li><b>Lagna</b> '+sk(f.lagna.sign)+' '+f.lagna.deg+'°</li>'+
    '<li><b>Chandra</b> '+sk(f.grahas.Moon.sign)+', '+esc(mn.name)+'-'+mn.pada+'</li>'+
    '<li><b>Mahādaśā</b> '+GN[now[0].lord]+' to '+fd(now[0].e)+'</li>'+
    '<li><b>Antardaśā</b> '+GN[now[1].lord]+' to '+fd(now[1].e)+'</li></ul>';
  var rows=GRAHAS.map(function(k){var x=f.grahas[k];var n=[];
    if(x.vargottama)n.push('vargottama'); if(x.combust)n.push('combust'); if(x.lordOf.length)n.push('lord of '+x.lordOf.join(', '));
    return '<tr><td>'+GN[k]+'</td><td class="n">'+sk(x.sign)+' '+x.deg+'°</td><td class="n">'+x.house+'</td><td>'+(x.dig==='—'?'node':x.dig)+'</td><td>'+sk(x.navSign)+'</td><td>'+n.join(' · ')+'</td></tr>'}).join('');
  var pro=chart.prologue.map(function(p){return '<li><b>'+esc(p.title)+'</b><span>'+terms(chart,firstSentence(p.line))+'<span class="badge '+p.agreement+'">'+AGLABEL[p.agreement]+'</span></span></li>'}).join('');
  var div=chart.chapters.filter(function(c){return c.agreement==='divergent'}).map(function(c){return c.title}),
      conv=chart.chapters.filter(function(c){return c.agreement==='convergent'}).map(function(c){return c.title});
  var lensLine='<p style="margin:0">Where two or more lenses took a side: <b>agree</b> on '+(conv.join(', ')||'nothing yet')+'; <b>differ</b> on '+(div.join(', ')||'nothing yet')+'. Chapters with a single lens are leads, not conclusions.</p>';
  return '<p class="birth">'+esc(b.date)+' · '+esc(b.time)+' · UTC'+(b.tz>=0?'+':'')+b.tz+' · '+esc(b.place)+' · lahiri ayanāṁśa '+f.ayanamsa+'° · as of '+esc(chart.asOf)+'</p>'+glance+
    '<div class="box"><h3>The story in one pass</h3><ul class="prologue">'+pro+'</ul></div>'+
    '<div class="box"><h3>How the lenses sit</h3>'+lensLine+'</div>'+
    '<div class="box"><h3>Chart at a glance</h3><div class="tablewrap"><table><thead><tr><th>Graha</th><th>Rāśi</th><th>Bhava</th><th>Dignity</th><th>Navāṁśa</th><th>Notes</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    chart.chapters.map(function(ch){return chapterHTML(chart,ch)}).join('');
}
function waitingHTML(chart){
  return '<div class="box wait"><h3>'+esc(chart.name)+' · waiting for birth data</h3><p class="why">No birth details for '+esc(chart.name)+' exist in this project yet, so nothing has been computed or guessed. Add date, local time, UTC offset and place, then rebuild; this tab fills with the same eight chapters.</p>'+
    '<p class="cmd">story-lab/charts.json  →  "birth": { "date": "YYYY-MM-DD", "time": "HH:MM",\n  "tz": -5, "lat": 0.0, "lon": 0.0, "place": "City" }\n\nnode story-lab/build.js</p></div>';
}
var cur=0;
try{var sv=localStorage.getItem('jsr-tab'); if(sv!==null) cur=Math.min(+sv||0,D.charts.length-1)}catch(e){}
function show(i){
  cur=i; try{localStorage.setItem('jsr-tab',String(i))}catch(e){}
  var ch=D.charts[i];
  document.getElementById('bar').textContent='Jyotish Story Reader · '+ch.name;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b,j){b.setAttribute('aria-selected',j===i?'true':'false')});
  document.getElementById('view').innerHTML=ch.status==='computed'?computedHTML(ch):waitingHTML(ch);
  Array.prototype.forEach.call(document.querySelectorAll('input[type=file]'),function(inp){
    inp.addEventListener('change',function(){var file=inp.files&&inp.files[0]; if(!file) return; var r=new FileReader();
      r.onload=function(){var art=inp.parentNode.querySelector('.art'); var old=art.querySelector('img'); if(old) old.remove(); var im=document.createElement('img'); im.alt='Reference image for this chapter (kept in this tab only)'; im.src=r.result; art.appendChild(im)};
      r.readAsDataURL(file)});
  });
}
var tabs=document.getElementById('tabs');
D.charts.forEach(function(c,i){var b=document.createElement('button'); b.type='button'; b.setAttribute('role','tab'); b.id='tab-'+c.id;
  b.textContent=c.name+(c.status==='computed'?'':' (needs birth data)'); b.addEventListener('click',function(){show(i)}); tabs.appendChild(b)});
document.getElementById('foot').innerHTML=
  '<p><b>How this was made.</b> A single-file engine computes positions, houses, dignities, navāṁśa, karakas and daśā. '+D.lenses.length+' lenses then apply fixed rules to those facts; each sentence above links to the chart facts that triggered it. The wording is written for this app in a case-method style and is not quoted from any author.</p>'+
  '<p><b>Reading it.</b> ▲ supportive, ▼ strained, ◆ descriptive. A lens score adds weight × direction for its findings. This is study material about patterns and timing, not a forecast; every strain comes with its own room for awareness and choice.</p>'+
  '<p><i>Offered with every good wish for the learning.</i></p>';
show(cur);
})();
</script>
