name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["www/**", "android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pl0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish as pl0-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete pl0-latest --cleanup-tag -y || true
          gh release create pl0-latest android/app/build/outputs/apk/debug/app-debug.apk             --target "$GITHUB_SHA" --latest --title "PL0" --notes "PL0"
